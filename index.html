<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaadein</title>
  <meta name="description" content="A calm, familiar place for someone living with dementia: family faces with the sound of their names, old songs, naat sharif and gentle games.">
  <meta name="theme-color" content="#faf9f5">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yaadein">
  <meta name="format-detection" content="telephone=no">
  <!-- YouTube embeds refuse to play without a Referer (error 153), so keep the default policy. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <header class="topbar" id="topbar" hidden>
      <button class="topbar-home" id="homeBtn" type="button">
        <span class="topbar-home-icon" aria-hidden="true"></span>
        <span class="topbar-home-label" id="homeLabel">Home</span>
      </button>
      <h1 class="topbar-title" id="screenTitle"></h1>
      <button class="topbar-repeat" id="repeatBtn" type="button">
        <span class="topbar-repeat-icon" aria-hidden="true"></span>
        <span class="visually-hidden" id="repeatLabel">Say it again</span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <div id="overlay" class="overlay" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Yaadein needs JavaScript to run. Please open it in Chrome, Safari or Edge.</p>
    </noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
